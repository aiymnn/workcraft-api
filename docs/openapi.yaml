openapi: 3.0.3

info:
  title: Workcraft API
  description: |
    Studio-ops API for Workcraft. Response envelope: `{ status: "success"|"error", data? | message? }`.
    Authenticated routes expect `Authorization: Bearer <JWT>`. Domain routes require studio membership on the token.
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: System
    description: Health checks
  - name: Auth
    description: Login and current session
  - name: Users
    description: Platform users (RBAC)
  - name: Clients
    description: Studio clients book
  - name: Settings
    description: Studio settings, option catalogs, reminders, templates
  - name: Team
    description: Login members and crew contacts
  - name: Account
    description: Self-service profile and security
  - name: Quotations
    description: Quotes and nested lines/sessions/payments/contracts
  - name: Jobs
    description: Jobs, checklist, deliverables
  - name: Calendar
    description: Session calendar reads
  - name: Money
    description: Invoices, payments, expenses, drawings, other income
  - name: Portal
    description: Client portal tokens and public payload
  - name: Dashboard
    description: Studio KPI summary
  - name: Pricing
    description: Opex, targets, saved calculations

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApiError:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          example: error
        message:
          type: string
    ApiSuccess:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: success
        data:
          description: Endpoint-specific payload
    Pagination:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        message:
          type: string
    DatabaseHealthResponse:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
        result:
          type: array
          items:
            type: object

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    PageQuery:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeQuery:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SearchQuery:
      name: search
      in: query
      schema:
        type: string

paths:
  /api/health:
    get:
      tags: [System]
      summary: Check API health
      operationId: getHealth
      responses:
        "200":
          description: API is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/db/health:
    get:
      tags: [System]
      summary: Check database connection
      operationId: getDatabaseHealth
      responses:
        "200":
          description: Database is connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseHealthResponse"
        "500":
          description: Database connection failed

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login and receive JWT
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Login success — accessToken, user, studio, access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Current user, studio, and access
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Session profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"

  /api/users:
    get:
      tags: [Users]
      summary: List platform users
      operationId: listUsers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
    post:
      tags: [Users]
      summary: Create platform user
      operationId: createUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"

  /api/users/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    patch:
      tags: [Users]
      summary: Update platform user
      operationId: updateUser
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
    delete:
      tags: [Users]
      summary: Delete platform user
      operationId: deleteUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"

  /api/clients:
    get:
      tags: [Clients]
      summary: List clients
      operationId: listClients
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
        - $ref: "#/components/parameters/SearchQuery"
        - name: includeRetired
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Paginated clients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
    post:
      tags: [Clients]
      summary: Create client
      operationId: createClient
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                phone:
                  type: string
                  nullable: true
                email:
                  type: string
                  nullable: true
                nricOrSsm:
                  type: string
                  nullable: true
                tin:
                  type: string
                  nullable: true
                socialHandle:
                  type: string
                  nullable: true
                address:
                  type: string
                  nullable: true
                whatsappConsent:
                  type: boolean
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"

  /api/clients/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [Clients]
      summary: Get client
      operationId: getClient
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Client detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
    patch:
      tags: [Clients]
      summary: Update client
      operationId: updateClient
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
    delete:
      tags: [Clients]
      summary: Soft-delete (retire) client
      operationId: deleteClient
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Retired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"

  /api/settings/studio:
    get:
      tags: [Settings]
      summary: Get studio settings
      operationId: getStudioSettings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Studio row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
    patch:
      tags: [Settings]
      summary: Patch studio settings
      operationId: patchStudioSettings
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Updated studio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"

  /api/settings/options:
    get:
      tags: [Settings]
      summary: List option catalogs
      operationId: listOptionCatalogs
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Catalogs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"

  /api/settings/options/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          enum:
            [
              CEREMONY_TYPE,
              JOB_TYPE,
              LEAD_SOURCE,
              PAY_METHOD,
              EXPENSE_CAT,
              INCOME_CAT,
              CANCEL_REASON,
              BANK,
              CREW_ROLE,
              CRAFT,
              EQUIP_LOCATION,
            ]
    get:
      tags: [Settings]
      summary: Get one option catalog
      operationId: getOptionCatalog
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"

  /api/settings/options/{key}/seed:
    parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Settings]
      summary: Seed built-in option catalog
      operationId: seedOptionCatalog
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Seeded catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"

  /api/settings/options/{key}/items:
    parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Settings]
      summary: Add option item
      operationId: addOptionItem
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label:
                  type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"

  /api/settings/options/items/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    patch:
      tags: [Settings]
      summary: Update or retire option item
      operationId: updateOptionItem
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                sortOrder:
                  type: integer
                retire:
                  type: boolean
      responses:
        "200":
          description: Updated catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"

  /api/settings/reminders:
    get:
      tags: [Settings]
      summary: List payment reminder rules
      operationId: listReminders
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
    put:
      tags: [Settings]
      summary: Replace payment reminder rules
      operationId: putReminders
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rules]
              properties:
                rules:
                  type: array
                  items:
                    type: object
                    required: [days, dir, enabled]
                    properties:
                      days:
                        type: integer
                      dir:
                        type: string
                        enum: [before, after, on]
                      enabled:
                        type: boolean
      responses:
        "200":
          description: Replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"

  /api/settings/packages:
    get:
      tags: [Settings]
      summary: List packages
      operationId: listPackages
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Packages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
    post:
      tags: [Settings]
      summary: Create package
      operationId: createPackage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                price:
                  oneOf:
                    - type: number
                    - type: string
                description:
                  type: string
                  nullable: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"

  /api/settings/packages/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [Settings]
      summary: Get package
      operationId: getPackage
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
    patch:
      tags: [Settings]
      summary: Update package
      operationId: updatePackage
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
    delete:
      tags: [Settings]
      summary: Delete package
      operationId: deletePackage
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"

  /api/settings/payment-plans:
    get:
      tags: [Settings]
      summary: List payment plans
      operationId: listPaymentPlans
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
    post:
      tags: [Settings]
      summary: Create payment plan
      operationId: createPaymentPlan
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                milestones:
                  type: array
                  items:
                    type: object
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"

  /api/settings/payment-plans/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [Settings]
      summary: Get payment plan
      operationId: getPaymentPlan
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
    patch:
      tags: [Settings]
      summary: Update payment plan (milestones replace when sent)
      operationId: updatePaymentPlan
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
    delete:
      tags: [Settings]
      summary: Delete payment plan
      operationId: deletePaymentPlan
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"

  /api/settings/contracts:
    get:
      tags: [Settings]
      summary: List contract templates
      operationId: listContracts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Contracts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
    post:
      tags: [Settings]
      summary: Create contract template
      operationId: createContract
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, body]
              properties:
                name:
                  type: string
                body:
                  type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"

  /api/settings/contracts/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [Settings]
      summary: Get contract template
      operationId: getContract
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Contract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
    patch:
      tags: [Settings]
      summary: Update contract template
      operationId: updateContract
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
    delete:
      tags: [Settings]
      summary: Delete contract template
      operationId: deleteContract
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"

  /api/settings/checklists:
    get:
      tags: [Settings]
      summary: List checklist templates
      operationId: listChecklists
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Checklists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
    post:
      tags: [Settings]
      summary: Create checklist template
      operationId: createChecklist
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                isDefault:
                  type: boolean
                items:
                  type: array
                  items:
                    type: object
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"

  /api/settings/checklists/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [Settings]
      summary: Get checklist template
      operationId: getChecklist
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Checklist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
    patch:
      tags: [Settings]
      summary: Update checklist template
      operationId: updateChecklist
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
    delete:
      tags: [Settings]
      summary: Delete checklist template
      operationId: deleteChecklist
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"

  /api/settings/checklists/{id}/duplicate:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [Settings]
      summary: Duplicate checklist template
      operationId: duplicateChecklist
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Duplicated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"

  /api/settings/email-templates:
    get:
      tags: [Settings]
      summary: List email templates
      operationId: listEmailTemplates
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"

  /api/settings/email-templates/seed:
    post:
      tags: [Settings]
      summary: Seed default email templates
      operationId: seedEmailTemplates
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Seeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"

  /api/settings/email-templates/{type}:
    parameters:
      - name: type
        in: path
        required: true
        schema:
          type: string
          enum: [QUOTE, INVOICE, REM_BEFORE, REM_DUE, REM_AFTER]
    put:
      tags: [Settings]
      summary: Upsert email template by type
      operationId: upsertEmailTemplate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, subject, body]
              properties:
                title:
                  type: string
                subject:
                  type: string
                body:
                  type: string
      responses:
        "200":
          description: Upserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"

  /api/settings/whatsapp-templates:
    get:
      tags: [Settings]
      summary: List WhatsApp templates
      operationId: listWhatsappTemplates
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"

  /api/settings/whatsapp-templates/seed:
    post:
      tags: [Settings]
      summary: Seed default WhatsApp templates
      operationId: seedWhatsappTemplates
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Seeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"

  /api/settings/whatsapp-templates/{type}:
    parameters:
      - name: type
        in: path
        required: true
        schema:
          type: string
          enum: [QUOTE, INVOICE, REM_BEFORE, REM_DUE, REM_AFTER, CONTRACT]
    put:
      tags: [Settings]
      summary: Upsert WhatsApp template by type
      operationId: upsertWhatsappTemplate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, body]
              properties:
                title:
                  type: string
                body:
                  type: string
      responses:
        "200":
          description: Upserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"

  /api/team/members:
    get:
      tags: [Team]
      summary: List team members
      operationId: listTeamMembers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
    post:
      tags: [Team]
      summary: Create team login (ADMIN/MEMBER)
      operationId: createTeamMember
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, access]
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
                  minLength: 8
                phone:
                  type: string
                  nullable: true
                access:
                  type: string
                  enum: [ADMIN, MEMBER]
                craftItemIds:
                  type: array
                  items:
                    type: integer
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:

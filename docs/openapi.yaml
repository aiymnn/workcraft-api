  /api/account/password:
    post:
      tags: [Account]
      summary: Change password
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
      responses:
        "200":
          description: Changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
        "401":
          description: Wrong current password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/account/email:
    post:
      tags: [Account]
      summary: Request an email change
      description: >
        Stores a hashed, 24-hour token and emails the new address a confirmation
        link. Without SMTP the response carries `confirmUrl` instead.
      operationId: changeEmail
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newEmail, password]
              properties:
                newEmail:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: requested, newEmail, expiresAt, emailSent, confirmUrl
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
        "401":
          description: Wrong password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/account/email/confirm:
    post:
      tags: [Account]
      summary: Confirm an email change (public)
      description: Reached from the emailed link, so it carries no Bearer token.
      operationId: confirmEmailChange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          description: changed, email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
        "404":
          description: Token invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/account/2fa/enroll:
    post:
      tags: [Account]
      summary: Start TOTP enrollment
      description: Stores a pending secret; 2FA only turns on after /2fa/confirm.
      operationId: enroll2fa
      security:
        - bearerAuth: []
      responses:
        "200":
          description: secret, otpauthUrl, qrDataUrl
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
        "409":
          description: 2FA already enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/account/2fa/confirm:
    post:
      tags: [Account]
      summary: Confirm TOTP enrollment
      operationId: confirm2fa
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  minLength: 6
                  maxLength: 6
      responses:
        "200":
          description: enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
        "400":
          description: Invalid code or no pending enrollment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/account/2fa/disable:
    post:
      tags: [Account]
      summary: Turn TOTP off
      description: Confirm with either the account password or a current code.
      operationId: disable2fa
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                code:
                  type: string
                  minLength: 6
                  maxLength: 6
      responses:
        "200":
          description: disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
        "400":
          description: No proof supplied, or the code was wrong
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/account/sessions/revoke-all:
    post:
      tags: [Account]
      summary: Sign out everywhere
      description: Revokes every session for the user; existing JWTs start returning 401.
      operationId: revokeAllSessions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: revoked count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"

  /api/account/oauth/google/start:
    get:
      tags: [Account]
      summary: Begin Google OAuth
      operationId: startGoogleOauth
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: purpose
          required: true
          schema:
            type: string
            enum: [calendar, drive]
        - in: query
          name: redirect
          description: Pass `1` to 302 straight to Google instead of returning JSON.
          schema:
            type: string
      responses:
        "200":
          description: url
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
        "302":
          description: Redirect to Google
        "503":
          description: Google is not configured on this server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/account/oauth/google/callback:
    get:
      tags: [Account]
      summary: Google OAuth callback (public)
      description: >
        Google redirects the browser here without an Authorization header; the
        signed `state` identifies the user. Redirects to
        `/app/account?google=connected|error`.
      operationId: googleOauthCallback
      parameters:
        - in: query
          name: code
          schema:
            type: string
        - in: query
          name: state
          schema:
            type: string
      responses:
        "302":
          description: Redirect back to the Account page
        "503":
          description: Google is not configured on this server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/account/oauth/google/disconnect:
    post:
      tags: [Account]
      summary: Disconnect a Google purpose
      operationId: disconnectGoogle
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose]
              properties:
                purpose:
                  type: string
                  enum: [calendar, drive]
      responses:
        "200":
          description: disconnected, connections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
        "404":
          description: Google is not connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/account/oauth/google/sync:
    post:
      tags: [Account]
      summary: Sync now with Google
      operationId: syncGoogle
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose]
              properties:
                purpose:
                  type: string
                  enum: [calendar, drive]
      responses:
        "200":
          description: synced, purpose, syncedAt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
        "409":
          description: Not connected, or that purpose is off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/account/footage-portal:
    post:
      tags: [Account]
      summary: Turn the footage portal on or off
      description: >
        Upserts the user's `GOOGLE` connection row with the flag only — no OAuth
        tokens required.
      operationId: setFootagePortal
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        "200":
          description: footagePortalEnabled, connections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"

  /api/quotations:
    get:

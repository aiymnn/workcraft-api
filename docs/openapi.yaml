      - name: token
        in: path
        required: true
        schema:
          type: string
      - name: invoiceId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      tags: [Portal]
      summary: Download an invoice PDF from the client portal (no auth)
      description: The portal token must belong to the invoice's job.
      operationId: getPortalInvoicePdf
      responses:
        "200":
          description: PDF document
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Invalid token or invoice not on this job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/portal/{token}/checkout:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Portal]
      summary: Start an online (CHIP) payment for an invoice (no auth)
      description: >-
        Requires the studio to have CHIP enabled and the server to have
        CHIP_BRAND_ID, CHIP_API_KEY and CHIP_WEBHOOK_SECRET set. Otherwise
        responds 503.
      operationId: createPortalCheckout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invoiceId]
              properties:
                invoiceId:
                  type: integer
                  minimum: 1
                milestoneId:
                  type: integer
                  minimum: 1
                  nullable: true
      responses:
        "201":
          description: Hosted checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
        "404":
          description: Invalid token or invoice not on this job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Nothing left to pay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Online payment is not available yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/webhooks/chip:
    post:
      tags: [Portal]
      summary: CHIP payment callback (no auth, signature verified)
      description: >-
        Raw body signed with the shared secret in X-Signature (verbatim secret
        or HMAC-SHA256 of the body). Events are de-duplicated by event id in
        chip_webhook_events; a paid event settles the referenced milestones.
      operationId: chipWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Received (may be a duplicate or a non-payment event)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
        "401":
          description: Invalid signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: CHIP is not configured on this server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"


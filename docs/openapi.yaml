      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId]
              properties:
                clientId:
                  type: integer
                status:
                  type: string
                  enum: [DRAFT, SENT, ACCEPTED, LOST]
                currency:
                  type: string
                intro:
                  type: string
                  nullable: true
                notes:
                  type: string
                  nullable: true
                lineItems:
                  type: array
                  items:
                    type: object
                sessions:
                  type: array
                  items:
                    type: object
                paymentRows:
                  type: array
                  items:
                    type: object
                contracts:
                  type: array
                  items:
                    type: object
      responses:
        "201":
          description: Created (number QUO-YYYY-####)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"

  /api/quotations/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"

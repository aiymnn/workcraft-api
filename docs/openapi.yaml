                $ref: "#/components/schemas/ApiSuccess"
    patch:
      tags: [Quotations]
      summary: Update quotation (nested arrays replace when sent)
      operationId: updateQuotation
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
    delete:
      tags: [Quotations]
      summary: Delete quotation
      operationId: deleteQuotation
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"

  /api/quotations/{id}/booking-link:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [Quotations]
      summary: Issue or rotate the public booking link token
      operationId: issueQuotationBookingLink
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                rotate:
                  type: boolean
                  description: Replace an existing token
      responses:
        "201":
          description: "{ token, urlPath, quotationId, number }"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
        "404":
          description: Quotation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/quotations/{id}/share-message:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [Quotations]
      summary: Build the WhatsApp / email share message for a quote
      description: >
        Ensures a booking-link token, renders the studio template for the channel
        (falling back to a built-in default) and returns the text plus the public
        link. No SMTP needed.
      operationId: shareQuotationMessage
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                markSent:
                  type: boolean
                  description: Move a DRAFT quote to SENT
                channel:
                  type: string
                  enum: [whatsapp, email]
                  default: whatsapp
      responses:
        "200":
          description: "{ text, subject?, waUrl, link, token, status }"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
        "404":
          description: Quotation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/quotations/{id}/send-email:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [Quotations]
      summary: Email the quote link to the client
      operationId: sendQuotationEmail
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                to:
                  type: string
                  format: email
                  description: Defaults to the client email on the quote
                attachPdf:
                  type: boolean
                markSent:
                  type: boolean
      responses:
        "200":
          description: "{ to, subject, link, attachedPdf, messageId, status }"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
        "400":
          description: No recipient email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: SMTP not configured on the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/quotations/{id}/pdf:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [Quotations]
      summary: Download the quotation PDF
      operationId: getQuotationPdf
      security:
        - bearerAuth: []
      responses:
        "200":
          description: PDF document
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Quotation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/quotations/{id}/convert:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [Quotations]
      summary: Convert quotation to a CONFIRMED job (needs quotations.update + jobs.create)
      operationId: convertQuotationToJob
      security:
        - bearerAuth: []
      requestBody:
        description: Optional session dates for undated quote sessions
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionOverrides:
                  type: array
                  items:
                    type: object
                    properties:
                      quotationSessionId:
                        type: integer
                      label:
                        type: string
                        nullable: true
                      startsAt:
                        type: string
                        format: date-time
                        nullable: true
                      endsAt:
                        type: string
                        format: date-time
                        nullable: true
                      venue:
                        type: string
                        nullable: true
      responses:
        "200":
          description: Job already existed for this quotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
        "201":
          description: "{ job, quotation } created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
        "409":
          description: Quotation is LOST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/public/quotations/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Public Quotations]
      summary: Public quote payload (no auth)
      operationId: getPublicQuotation
      responses:
        "200":
          description: Studio summary, client, quotation with nested arrays
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
        "404":
          description: Unknown token or LOST quotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/public/quotations/{token}/pdf:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Public Quotations]
      summary: Download the quotation PDF from the client-facing page (no auth)
      operationId: getPublicQuotationPdf
      responses:
        "200":
          description: PDF document
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Unknown token or LOST quotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/public/quotations/{token}/accept:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Public Quotations]
      summary: Client accepts the quote (no auth); idempotent
      operationId: acceptPublicQuotation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agreementAccepted]
              properties:
                agreementAccepted:
                  type: boolean
                  enum: [true]
                sessions:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                      label:
                        type: string
                        nullable: true
                      startsAt:
                        type: string
                        format: date-time
                        nullable: true
                      endsAt:
                        type: string
                        format: date-time
                        nullable: true
                      venue:
                        type: string
                        nullable: true
      responses:
        "200":
          description: "Accepted; `alreadyAccepted` true when it was already ACCEPTED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
        "404":
          description: Unknown token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Quotation is LOST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/jobs:
    get:
      tags: [Jobs]
      summary: List jobs
      operationId: listJobs
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
        - $ref: "#/components/parameters/SearchQuery"
        - name: status
          in: query
          schema:
            type: string
            enum: [CONFIRMED, COMPLETED, CANCELLED]
      responses:
        "200":
          description: Paginated jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
    post:
      tags: [Jobs]
      summary: Create job
      operationId: createJob
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId]
              properties:
                clientId:
                  type: integer
                quotationId:
                  type: integer
                  nullable: true
                status:
                  type: string
                  enum: [CONFIRMED, COMPLETED, CANCELLED]
                sessions:
                  type: array
                  items:
                    type: object
                checklistItems:
                  type: array
                  items:
                    type: object
                deliverables:
